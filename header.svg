<svg xmlns="http://www.w3.org/2000/svg" width="600" height="78" viewBox="0 0 600 78" role="img" aria-label="Hello! I am Arif Budiono, System Administrator">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; text-anchor: middle; fill: #1f2328; }
    .hello { font-size: 20px; font-weight: bold; }
    .name { fill: #0969da; }
    .role { font-size: 18px; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .name { fill: #58a6ff; }
    }
  </style>
  <text class="hello" x="300" y="32">Hello! I am <tspan class="name">Arif Budiono</tspan></text>
  <text class="role" x="300" y="68">「 System Administrator 」</text>
</svg>
