<svg xmlns="http://www.w3.org/2000/svg" width="560" height="226" viewBox="0 0 560 226" role="img" aria-label="Terminal: arif budiono, system administrator">
  <style>
    text { font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #c9d1d9; }
    .u { fill: #3fb950; }
    .d { fill: #58a6ff; }
    .m { fill: #8b949e; }
    .l { opacity: 0; animation: show .01s forwards; }
    .a { animation-delay: .4s; }
    .b { animation-delay: .9s; }
    .c { animation-delay: 1.5s; }
    .e { animation-delay: 2s; }
    .f { animation-delay: 2.6s; }
    .g { animation-delay: 3.1s; }
    .h { animation-delay: 3.6s; }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect x=".5" y=".5" width="559" height="225" rx="8" fill="#0d1117" stroke="#30363d"/>
  <path d="M.5 8a8 8 0 0 1 8-7.5h543a8 8 0 0 1 8 7.5V32H.5z" fill="#161b22"/>
  <circle cx="20" cy="16" r="5" fill="#ff5f56"/>
  <circle cx="38" cy="16" r="5" fill="#ffbd2e"/>
  <circle cx="56" cy="16" r="5" fill="#27c93f"/>
  <text x="280" y="20" text-anchor="middle" class="m" style="font-size:12px">arif@server: ~</text>

  <text x="24" y="62" class="l a"><tspan class="u">arif@server</tspan>:<tspan class="d">~</tspan>$ whoami</text>
  <text x="24" y="86" class="l b">arif budiono — system administrator</text>

  <text x="24" y="110" class="l c"><tspan class="u">arif@server</tspan>:<tspan class="d">~</tspan>$ cat stack.txt</text>
  <text x="24" y="134" class="l e">linux · windows-server · bash · python · docker · nginx</text>

  <text x="24" y="158" class="l f"><tspan class="u">arif@server</tspan>:<tspan class="d">~</tspan>$ echo "If I do it twice, I script it."</text>
  <text x="24" y="182" class="l g">If I do it twice, I script it.</text>

  <g class="l h">
    <text x="24" y="206"><tspan class="u">arif@server</tspan>:<tspan class="d">~</tspan>$</text>
    <rect class="cur" x="150" y="194" width="8" height="15" fill="#c9d1d9"/>
  </g>
</svg>
