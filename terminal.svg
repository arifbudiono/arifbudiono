<svg xmlns="http://www.w3.org/2000/svg" width="520" height="130" viewBox="0 0 520 130" role="img" aria-label="Terminal: If I do it twice, I script it.">
  <style>
    :root {
      --bg: #ffffff;
      --bar: #f6f8fa;
      --bd: #d0d7de;
      --fg: #1f2328;
      --user: #1a7f37;
      --dir: #0969da;
      --muted: #656d76;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --bar: #161b22;
        --bd: #30363d;
        --fg: #c9d1d9;
        --user: #3fb950;
        --dir: #58a6ff;
        --muted: #8b949e;
      }
    }

    text { font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: var(--fg); }
    .win { fill: var(--bg); stroke: var(--bd); }
    .bar { fill: var(--bar); }
    .u { fill: var(--user); }
    .d { fill: var(--dir); }
    .m { fill: var(--muted); }
    .cur { fill: var(--fg); animation: blink 1s steps(1) infinite; }

    .l { opacity: 0; animation: show .01s forwards; }
    .a { animation-delay: .4s; }
    .b { animation-delay: 1.1s; }
    .c { animation-delay: 1.6s; }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect class="win" x=".5" y=".5" width="519" height="129" rx="8"/>
  <path class="bar" d="M.5 8a8 8 0 0 1 8-7.5h503a8 8 0 0 1 8 7.5V32H.5z"/>
  <circle cx="20" cy="16" r="5" fill="#ff5f56"/>
  <circle cx="38" cy="16" r="5" fill="#ffbd2e"/>
  <circle cx="56" cy="16" r="5" fill="#27c93f"/>
  <text x="260" y="20" text-anchor="middle" class="m" style="font-size:12px">arif@server: ~</text>

  <text x="24" y="62" class="l a"><tspan class="u">arif@server</tspan>:<tspan class="d">~</tspan>$ echo "If I do it twice, I script it."</text>
  <text x="24" y="86" class="l b">If I do it twice, I script it.</text>

  <g class="l c">
    <text x="24" y="110"><tspan class="u">arif@server</tspan>:<tspan class="d">~</tspan>$</text>
    <rect class="cur" x="150" y="98" width="8" height="15"/>
  </g>
</svg>
